name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy the web app into the www folder
        run: |
          mkdir www
          cp index.html app.js style.css manifest.json sw.js www/
          cp icon-*.png www/ 2>/dev/null || true
          if [ -d icons ]; then cp -r icons www/; fi

      - name: Install Capacitor
        run: npm install

      - name: Create icon and splash source images
        run: python3 make_assets.py

      - name: Create the Android project
        run: npx cap add android

      - name: Generate Android icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0e2621' --splashBackgroundColor '#0c1210' --splashBackgroundColorDark '#0c1210'

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StudyOS-debug.apk

      - name: Save APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyOS-debug-apk
          path: StudyOS-debug.apk

      - name: Publish APK as a GitHub Release (easy download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: StudyOS APK build ${{ github.run_number }}
          files: StudyOS-debug.apk
